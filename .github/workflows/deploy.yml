name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 돌지 않게 한다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 버전은 package.json 의 packageManager 필드를 따른다 (lockfile 생성 버전과 일치).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 두 값 모두 공개 값이라 secret 이 아닌 variable 로 둔다.
      # (anon 키는 브라우저 번들에 포함되는 것이 전제이고, 실제 보안은 RLS 가 담당)
      - name: Build (static export)
        env:
          # NEXT_PUBLIC_* 는 빌드 시 번들에 인라인된다. 셋 다 비밀이 아니다 —
          # 발급자 주소와 앱 id 는 어차피 로그인 요청 URL 에 그대로 드러난다.
          # 자료 접근은 Omnis 가 세션 토큰과 구성원 자격을 보고 판단한다.
          NEXT_PUBLIC_OMNIS_URL: https://omnis-hadd.vercel.app
          NEXT_PUBLIC_SSO_APP_ID: ip-platform
          NEXT_PUBLIC_BASE_PATH: /ip-platform
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
